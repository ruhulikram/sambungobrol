<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2eddf">
  <title>404 - Halaman Tidak Ditemukan</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <main id="game-container" aria-label="Error 404">
    <section class="screen active" style="flex-direction: column; justify-content: space-between; gap: var(--screen-gap); text-align: center;">
      <div class="custom-logo-slot" style="margin: 0 auto;" aria-hidden="true">
        <span style="font-size: 24px;">404</span>
      </div>

      <div class="start-copy" style="place-items: center; text-align: center;">
        <p class="eyebrow">ERROR</p>
        <div class="game-title">
          <h1>Nyasar<br>Jauh.</h1>
        </div>
        <p class="game-desc">
          Halaman yang kamu cari mungkin sudah dihapus atau tidak pernah ada.
        </p>
      </div>
      
      <a href="/" class="btn btn-primary" style="display: grid; place-items: center; text-decoration: none;">
        Kembali ke Permainan
      </a>
    </section>
  </main>
</body>
</html>
