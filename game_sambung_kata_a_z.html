<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Sambung Kata A-Z</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts untuk tipografi yang lebih baik -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            /* Warna latar belakang yang lembut */
            /* Background pattern sederhana menggunakan linear-gradient */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Animasi masuk untuk elemen (fade in scale up) */
        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animasi keluar (fade out scale down) */
        .animate-pop-out {
            animation: popOut 0.3s ease-in forwards;
        }

        @keyframes popOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        /* Animasi getar untuk tombol (opsional, untuk interaksi) */
        .shake:active {
            animation: shake 0.2s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* Tampilan huruf besar */
        .letter-display {
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div id="game-container"
        class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center relative overflow-hidden transition-all duration-300 border-4 border-gray-100">

        <!-- ================== SCREEN 1: START ================== -->
        <div id="start-screen" class="flex flex-col items-center justify-center space-y-6">
            <div class="bg-indigo-100 p-4 rounded-full mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-indigo-600" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5" />
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-800 leading-tight">
                Sambungin Kalimat <br> <span class="text-indigo-600 text-5xl">A - Z</span>
            </h1>
            <p class="text-gray-500 font-medium px-4">
                Game ngobrol nyambung tapi sesuai abjad ya
            </p>
            <button id="btn-start"
                class="shake mt-8 w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-xl rounded-2xl shadow-lg transform transition hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                Mulai!
            </button>
        </div>

        <!-- ================== SCREEN 2: GAMEPLAY ================== -->
        <div id="game-screen" class="hidden flex-col items-center justify-center w-full h-full min-h-[350px]">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-3 mb-8 absolute top-0 left-0">
                <div id="progress-bar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300"
                    style="width: 0%"></div>
            </div>

            <!-- Menampilkan Huruf -->
            <div class="flex-grow flex items-center justify-center flex-col relative w-full h-48 mt-4">
                <p id="current-letter"
                    class="letter-display text-[150px] font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 leading-none m-0">
                    A
                </p>
            </div>

            <p class="text-gray-500 text-lg font-medium mb-6">Siapa yang dapat huruf ini?</p>

            <button id="btn-next"
                class="shake w-full py-5 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold text-2xl rounded-2xl shadow-xl transform transition hover:-translate-y-1 active:scale-95 focus:outline-none flex items-center justify-center space-x-2">
                <span>SELANJUTNYA</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                        d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- ================== SCREEN 3: END/FINISH ================== -->
        <div id="end-screen" class="hidden flex-col items-center justify-center space-y-6 py-6">
            <div class="text-7xl mb-4 animate-bounce">
                🎉
            </div>
            <h2 class="text-4xl font-extrabold text-gray-800">
                SELESAI!
            </h2>
            <p class="text-gray-600 text-lg text-center px-4">
                Kalian berhasil menyelesaikan tantangan dari A sampai Z.
            </p>
            <button id="btn-restart"
                class="shake mt-8 w-full py-4 bg-gray-800 hover:bg-black text-white font-bold text-xl rounded-2xl shadow-lg transform transition hover:-translate-y-1 focus:outline-none">
                Main Lagi
            </button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Referensi Elemen UI
            const startScreen = document.getElementById('start-screen');
            const gameScreen = document.getElementById('game-screen');
            const endScreen = document.getElementById('end-screen');

            const btnStart = document.getElementById('btn-start');
            const btnNext = document.getElementById('btn-next');
            const btnRestart = document.getElementById('btn-restart');

            const currentLetterDisplay = document.getElementById('current-letter');
            const progressBar = document.getElementById('progress-bar');
            const gameContainer = document.getElementById('game-container');

            // State Game
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let currentIndex = 0;

            function showScreen(screenToShow, screenToHide) {
                // Beri animasi keluar pada layar yang akan disembunyikan
                if (screenToHide) {
                    screenToHide.classList.add('animate-pop-out');
                    setTimeout(() => {
                        screenToHide.classList.remove('animate-pop-out');
                        screenToHide.classList.add('hidden');
                        screenToHide.classList.remove('flex');

                        // Tampilkan layar baru dengan animasi masuk
                        screenToShow.classList.remove('hidden');
                        screenToShow.classList.add('flex', 'animate-pop-in');

                        // Hapus class animasi setelah selesai agar bisa dipakai lagi nanti
                        setTimeout(() => {
                            screenToShow.classList.remove('animate-pop-in');
                        }, 500);
                    }, 300); // Waktu timeout sama dengan durasi popOut di CSS
                } else {
                    // Kasus khusus untuk tampilan pertama kali (jika diperlukan)
                    screenToShow.classList.remove('hidden');
                    screenToShow.classList.add('flex', 'animate-pop-in');
                }
            }

            function updateGameUI() {
                const letter = alphabet[currentIndex];

                // Animasi pergantian huruf
                currentLetterDisplay.classList.add('animate-pop-out');

                setTimeout(() => {
                    currentLetterDisplay.textContent = letter;
                    currentLetterDisplay.classList.remove('animate-pop-out');
                    currentLetterDisplay.classList.add('animate-pop-in');

                    setTimeout(() => {
                        currentLetterDisplay.classList.remove('animate-pop-in');
                    }, 500);
                }, 150); // Waktu ganti text sedikit lebih cepat dari animasi keluar

                // Update Progress Bar
                const progressPercentage = ((currentIndex + 1) / alphabet.length) * 100;
                progressBar.style.width = `${progressPercentage}%`;

                // Ubah teks tombol jika huruf terakhir
                if (currentIndex === alphabet.length - 1) {
                    btnNext.innerHTML = `
                        <span>SELESAI</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 ml-2 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    `;
                    // Ubah warna tombol jadi hijau untuk menandakan selesai
                    btnNext.classList.remove('from-blue-500', 'to-indigo-600', 'hover:from-blue-600', 'hover:to-indigo-700');
                    btnNext.classList.add('from-green-500', 'to-emerald-600', 'hover:from-green-600', 'hover:to-emerald-700');
                } else {
                    btnNext.innerHTML = `
                        <span>SELANJUTNYA</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 ml-2 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                        </svg>
                    `;
                    // Kembalikan warna tombol
                    btnNext.classList.remove('from-green-500', 'to-emerald-600', 'hover:from-green-600', 'hover:to-emerald-700');
                    btnNext.classList.add('from-blue-500', 'to-indigo-600', 'hover:from-blue-600', 'hover:to-indigo-700');
                }
            }


            // Event Mulai
            btnStart.addEventListener('click', () => {
                currentIndex = 0;
                updateGameUI();
                showScreen(gameScreen, startScreen);
            });

            // Event Tombol Next
            btnNext.addEventListener('click', () => {
                // Efek getar sedikit pada container setiap kali di klik
                gameContainer.style.transform = 'scale(0.98)';
                setTimeout(() => { gameContainer.style.transform = 'scale(1)'; }, 100);

                if (currentIndex < alphabet.length - 1) {
                    // Lanjut huruf berikutnya
                    currentIndex++;
                    updateGameUI();
                } else {
                    // Game Selesai
                    showScreen(endScreen, gameScreen);
                }
            });

            // Event Main Lagi
            btnRestart.addEventListener('click', () => {
                showScreen(startScreen, endScreen);
            });

            // Opsional: Tekan spasi atau panah kanan untuk next (Desktop friendly)
            document.addEventListener('keydown', (e) => {
                if (!gameScreen.classList.contains('hidden')) {
                    if (e.code === 'Space' || e.code === 'ArrowRight') {
                        e.preventDefault(); // Mencegah scroll
                        btnNext.click();
                    }
                }
            });
        });
    </script>
</body>

</html>
